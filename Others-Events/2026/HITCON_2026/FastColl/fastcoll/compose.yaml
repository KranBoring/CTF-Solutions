name: fastcoll-challenge

services:
  fastcoll:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      FASTCOLL_FLAG_FILE: /run/secrets/flag
      FASTCOLL_WALL_SECONDS: "900"
      FASTCOLL_FUEL: "100000000000000"
      FASTCOLL_WORKERS: "2"
    secrets:
      - flag
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  flag:
    file: ./flag.txt
