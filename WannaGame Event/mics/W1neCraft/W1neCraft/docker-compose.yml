services:
  w1-minecraft:
    build: .
    ports:
      - "${HOST_PORT:-0}:${PUBLIC_PORT:-1337}"
    environment:
      MEMORY: ${MEMORY:-1536M}
      BACKEND_HOST: 127.0.0.1
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: ${PUBLIC_PORT:-1337}
      # Only for local development. Production injects FLAG through the
      # challenge-instance environment instead of this compose file.
      FLAG: ${FLAG:-W1{fake_flag}}
